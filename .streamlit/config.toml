[theme]
base = "light"
primaryColor = "#2D4BB8"
backgroundColor = "#F7F4ED"
secondaryBackgroundColor = "#EFE9DD"
textColor = "#111111"
borderColor = "#111111"
showWidgetBorder = true
baseRadius = "14px"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 10

enableStaticServing = true
