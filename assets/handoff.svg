<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-label="One student handing a box of room essentials to another student">
  <style>
    .sway { animation: sway 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .bobA { animation: bob 3.2s ease-in-out infinite; }
    .bobB { animation: bob 3.2s ease-in-out infinite; animation-delay: -1.6s; }
    .heart { animation: rise 3.2s ease-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
    .h2 { animation-delay: -1.1s; } .h3 { animation-delay: -2.2s; }
    .twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .t2 { animation-delay: -1.2s; }
    .spin { animation: spin 24s linear infinite; transform-box: fill-box; transform-origin: center; }
    .dash { stroke-dasharray: 8 10; animation: march 1.6s linear infinite; }
    @keyframes sway { 0%, 100% { transform: translateX(-7px) rotate(-3deg); } 50% { transform: translateX(7px) rotate(3deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(0) scale(.5); } 15% { opacity: 1; }
                      100% { opacity: 0; transform: translateY(-110px) scale(1.15); } }
    @keyframes twinkle { 0%, 100% { transform: scale(.7) rotate(0deg); } 50% { transform: scale(1.15) rotate(20deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes march { to { stroke-dashoffset: -36; } }
    .wobble { animation: wobble 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .w2 { animation-delay: -1.4s; }
    .pop { animation: pop 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .p2 { animation-delay: -1.6s; }
    @keyframes wobble { 0%, 100% { transform: rotate(-5deg) translateY(0); } 50% { transform: rotate(5deg) translateY(-5px); } }
    @keyframes pop { 0%, 100% { transform: scale(.9); } 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .heart { opacity: 1; } }
  </style>

  <!-- backdrop: sun, cobalt blob, path between the two homes -->
  <g class="spin">
    <circle cx="548" cy="86" r="54" fill="#F5C431" stroke="#111" stroke-width="3"/>
    <g stroke="#111" stroke-width="3" stroke-linecap="round">
      <line x1="548" y1="10" x2="548" y2="22"/><line x1="548" y1="150" x2="548" y2="162"/>
      <line x1="472" y1="86" x2="484" y2="86"/><line x1="612" y1="86" x2="624" y2="86"/>
    </g>
  </g>
  <path d="M28 120 C 40 60, 130 40, 160 90 C 190 140, 120 170, 80 160 C 40 150, 20 150, 28 120 Z" fill="#79A9F2" stroke="#111" stroke-width="3"/>
  <path d="M96 412 Q 320 352 560 412" fill="none" stroke="#111" stroke-width="3" class="dash" opacity=".5"/>
  <ellipse cx="170" cy="414" rx="70" ry="10" fill="#111" opacity=".12"/>
  <ellipse cx="470" cy="414" rx="70" ry="10" fill="#111" opacity=".12"/>

  <!-- sparkles -->
  <path class="twinkle" d="M330 52 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 z" fill="#EF5A2B" stroke="#111" stroke-width="2.5"/>
  <path class="twinkle t2" d="M420 170 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#12985A" stroke="#111" stroke-width="2"/>
  <path class="twinkle t2" d="M232 92 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#F5C431" stroke="#111" stroke-width="2"/>

  <!-- person A: moving out -->
  <g class="bobA">
    <rect x="146" y="330" width="20" height="78" rx="10" fill="#2D4BB8" stroke="#111" stroke-width="3"/>
    <rect x="174" y="330" width="20" height="78" rx="10" fill="#2D4BB8" stroke="#111" stroke-width="3"/>
    <rect x="124" y="222" width="92" height="124" rx="42" fill="#EF5A2B" stroke="#111" stroke-width="3"/>
    <path d="M206 252 L 262 262" stroke="#111" stroke-width="24" stroke-linecap="round"/>
    <path d="M206 252 L 262 262" stroke="#EF5A2B" stroke-width="17" stroke-linecap="round"/>
    <path d="M206 290 L 260 300" stroke="#111" stroke-width="24" stroke-linecap="round"/>
    <path d="M206 290 L 260 300" stroke="#EF5A2B" stroke-width="17" stroke-linecap="round"/>
    <circle cx="170" cy="178" r="40" fill="#F2B48C" stroke="#111" stroke-width="3"/>
    <path d="M131 172 C 128 132, 206 124, 210 168 C 196 152, 160 150, 140 166 Z" fill="#3B2A20" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="160" cy="182" r="4" fill="#111"/><circle cx="184" cy="182" r="4" fill="#111"/>
    <path d="M160 198 Q 172 208 184 198" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    <circle cx="150" cy="196" r="6" fill="#EF5A2B" opacity=".35"/>
  </g>

  <!-- person B: moving in -->
  <g class="bobB">
    <rect x="446" y="330" width="20" height="78" rx="10" fill="#111" stroke="#111" stroke-width="3"/>
    <rect x="474" y="330" width="20" height="78" rx="10" fill="#111" stroke="#111" stroke-width="3"/>
    <rect x="424" y="222" width="92" height="124" rx="42" fill="#12985A" stroke="#111" stroke-width="3"/>
    <path d="M434 252 L 378 262" stroke="#111" stroke-width="24" stroke-linecap="round"/>
    <path d="M434 252 L 378 262" stroke="#12985A" stroke-width="17" stroke-linecap="round"/>
    <path d="M434 290 L 380 300" stroke="#111" stroke-width="24" stroke-linecap="round"/>
    <path d="M434 290 L 380 300" stroke="#12985A" stroke-width="17" stroke-linecap="round"/>
    <circle cx="470" cy="178" r="40" fill="#8D5A3B" stroke="#111" stroke-width="3"/>
    <g fill="#111"><circle cx="440" cy="152" r="16"/><circle cx="462" cy="138" r="17"/><circle cx="486" cy="140" r="16"/>
      <circle cx="502" cy="158" r="13"/><circle cx="436" cy="172" r="10"/></g>
    <circle cx="458" cy="184" r="4" fill="#111"/><circle cx="482" cy="184" r="4" fill="#111"/>
    <path d="M454 198 Q 470 214 486 198 Z" fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="494" cy="198" r="6" fill="#EF5A2B" opacity=".35"/>
  </g>

  <!-- the box being handed over -->
  <g class="sway">
    <rect x="296" y="140" width="14" height="66" rx="5" fill="#2D4BB8" stroke="#111" stroke-width="3" transform="rotate(-14 303 206)"/>
    <path d="M286 132 l40 -10 10 26 -44 10 z" fill="#F5C431" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <path d="M262 214 L 300 192 L 338 214 Z" fill="#E7B47A" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <path d="M342 214 L 380 192 L 378 214 Z" fill="#E7B47A" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <rect x="262" y="212" width="116" height="100" rx="8" fill="#D99A5B" stroke="#111" stroke-width="3"/>
    <rect x="310" y="212" width="20" height="100" fill="#2D4BB8" stroke="#111" stroke-width="3"/>
    <path d="M286 262 c -8 -10 4 -20 10 -10 c 6 -10 18 0 10 10 l -10 10 z" fill="#EF5A2B" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="262" cy="262" r="12" fill="#F2B48C" stroke="#111" stroke-width="3"/>
    <circle cx="260" cy="300" r="12" fill="#F2B48C" stroke="#111" stroke-width="3"/>
    <circle cx="378" cy="262" r="12" fill="#8D5A3B" stroke="#111" stroke-width="3"/>
    <circle cx="380" cy="300" r="12" fill="#8D5A3B" stroke="#111" stroke-width="3"/>
  </g>

  <!-- hearts floating up from the handoff -->
  <path class="heart" d="M310 120 c -10 -12 6 -26 14 -12 c 8 -14 24 0 14 12 l -14 14 z" fill="#EF5A2B" stroke="#111" stroke-width="2.5"/>
  <path class="heart h2" d="M352 132 c -7 -9 4 -18 10 -8 c 6 -10 17 -1 10 8 l -10 10 z" fill="#F5C431" stroke="#111" stroke-width="2.5"/>
  <path class="heart h3" d="M276 128 c -7 -9 4 -18 10 -8 c 6 -10 17 -1 10 8 l -10 10 z" fill="#79A9F2" stroke="#111" stroke-width="2.5"/>

  <!-- benefits, no words. Moving out: easy (check) + earns money (+$). Moving in: easy (check) + saves (-% tag, coins). -->
  <g font-family="Arial Black, Segoe UI Black, Inter, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <g class="wobble">
      <rect x="18" y="226" width="92" height="56" rx="14" fill="#12985A" stroke="#111" stroke-width="3" transform="rotate(-16 64 254)"/>
      <text x="64" y="268" font-size="36" fill="#fff" stroke="#111" stroke-width="1.5" transform="rotate(-16 64 254)">+$</text>
    </g>
    <g class="wobble w2">
      <path d="M538 230 h 64 a 8 8 0 0 1 8 8 v 44 a 8 8 0 0 1 -8 8 h -64 l -22 -30 z" fill="#EF5A2B" stroke="#111"
            stroke-width="3" stroke-linejoin="round" transform="rotate(14 566 260)"/>
      <circle cx="532" cy="260" r="5" fill="#fff" stroke="#111" stroke-width="2.5" transform="rotate(14 566 260)"/>
      <text x="574" y="273" font-size="32" fill="#fff" stroke="#111" stroke-width="1.5" transform="rotate(14 566 260)">−%</text>
    </g>
    <g class="wobble w2">
      <ellipse cx="572" cy="340" rx="22" ry="8" fill="#F5C431" stroke="#111" stroke-width="3"/>
      <ellipse cx="572" cy="330" rx="22" ry="8" fill="#F5C431" stroke="#111" stroke-width="3"/>
      <ellipse cx="572" cy="320" rx="22" ry="8" fill="#F5C431" stroke="#111" stroke-width="3"/>
    </g>
    <g class="wobble">
      <ellipse cx="66" cy="340" rx="22" ry="8" fill="#F5C431" stroke="#111" stroke-width="3"/>
      <ellipse cx="66" cy="330" rx="22" ry="8" fill="#F5C431" stroke="#111" stroke-width="3"/>
      <path d="M66 296 v 24 M56 308 l 10 -12 10 12" fill="none" stroke="#12985A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g class="pop">
    <circle cx="98" cy="108" r="20" fill="#12985A" stroke="#111" stroke-width="3"/>
    <path d="M88 108 l 7 7 13 -14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="pop p2">
    <circle cx="548" cy="196" r="20" fill="#12985A" stroke="#111" stroke-width="3"/>
    <path d="M538 196 l 7 7 13 -14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
